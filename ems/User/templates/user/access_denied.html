{% extends "index.html" %}
{% load static %}

{% block page-title %}Access Denied{% endblock page-title %}

{% block main-body %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="modern-card">
                <div class="card-body text-center py-5">
                    <div class="mb-4">
                        <i class="fas fa-lock fa-4x text-danger"></i>
                    </div>
                    <h2 class="text-danger mb-3">Access Denied</h2>
                    <p class="text-muted mb-4">{{ message|default:"You don't have permission to access this resource." }}</p>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a href="{% url 'User:home' %}" class="btn-modern btn-primary-modern">
                            <i class="fas fa-home"></i>
                            Go to Dashboard
                        </a>
                        <a href="{% url 'User:logout' %}" class="btn-modern btn-secondary">
                            <i class="fas fa-sign-out-alt"></i>
                            Logout
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock main-body %}
