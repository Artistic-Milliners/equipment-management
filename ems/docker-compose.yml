version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ems_postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-ems}
      - POSTGRES_USER=${DB_USER:-zohaib}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-abcd@1234}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zohaib} -d ${DB_NAME:-ems}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ems_network

  # Django Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ems_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-(w#^*qpgwi)ui0j091g+ou7#5k52#zdp)89&sl_bx4&v^eb%j7}
      - DB_ENGINE=django.db.backends.postgresql_psycopg2
      - DB_NAME=${DB_NAME:-ems}
      - DB_USER=${DB_USER:-zohaib}
      - DB_PASSWORD=${DB_PASSWORD:-abcd@1234}
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - TZ=Asia/Karachi
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ems_network

  # Nginx Reverse Proxy (Optional but recommended for production)
  nginx:
    image: nginx:alpine
    container_name: ems_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - ems_network

volumes:
  postgres_data:
    driver: local

networks:
  ems_network:
    driver: bridge
