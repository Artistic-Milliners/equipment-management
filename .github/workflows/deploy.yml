name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:          # adds a manual "Run workflow" button

concurrency: deploy-production  # never run two deploys at once

jobs:
  deploy:
    runs-on: [self-hosted, ems-server]
    env:
      APP_DIR: /opt/ems/equipment-management
    steps:
      - name: Back up database before deploying
        run: |
          mkdir -p /opt/ems/backups
          docker exec ems_postgres sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' \
            | gzip > /opt/ems/backups/predeploy_$(date +%F_%H%M).sql.gz

      - name: Update code
        working-directory: ${{ env.APP_DIR }}
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Rebuild and restart containers
        working-directory: ${{ env.APP_DIR }}/ems
        run: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build

      - name: Health check
        timeout-minutes: 3
        run: |
          # Hit nginx on this machine directly; the Host header satisfies Django's ALLOWED_HOSTS.
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 3 --max-time 5 \
                   -H "Host: 172.25.25.173" http://127.0.0.1/ || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then echo "App is up ($code)"; exit 0; fi
            echo "Attempt $i: got '$code', retrying in 5s..."; sleep 5
          done
          echo "Health check failed. Container status:"
          docker ps --filter name=ems_ --format "{{.Names}}: {{.Status}}"
          echo "--- last 50 lines of ems_web ---"
          docker logs --tail 50 ems_web
          echo "--- last 20 lines of ems_nginx ---"
          docker logs --tail 20 ems_nginx
          exit 1

      - name: Remove old images
        if: success()
        run: docker image prune -f
